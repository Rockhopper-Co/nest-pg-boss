# Publishes @rockhopper-co/nest-pg-boss to GitHub Packages so the whole
# @rockhopper-co scope resolves from ONE registry (ENG-2392). npm offers only
# @scope:registry — there is no per-package override — so once backend/.npmrc
# pointed the scope at GitHub Packages, this package became unreachable there
# and backend/package.json had to pin a literal npmjs tarball URL. A literal
# URL is a frozen exact version in a production dependency that Dependabot
# cannot see. Publishing here is what lets that pin go back to a caret range.
#
# Existing npmjs versions (…, 2.2.0) stay published; this only stops NEW ones
# going there.
name: Publish package

# THE TRIGGER IS THE POINT. This runs on merge to `main` and NOT on a hand-cut
# tag, which is what the previous npmjs workflow used. A tag-driven publish
# makes a human the thing that has to remember, and nothing watches whether
# they did; Dependabot cannot bump a consumer to a version nobody cut.
#
# WHY 3.x (plan 117, DESIGN L4). The pg-boss 12 port moves the `pg-boss` peer
# range off `^10`, which is a breaking change for consumers. The backend
# depends on `^2.2.x`, so a pg-boss-12 build published as another 2.2.x would
# reach it through that caret range. `main` therefore publishes `3.0.<run>` on
# `latest`, which `^2.2.x` can never resolve.
#
# WHY THE E2E SUITE RUNS IN THIS JOB (plan 117 DESIGN D11, ENG-9432). A
# publish is where a consumer waits: the backend pins the exact prerelease this
# job publishes, so a wrapper that cannot boot, create its queues or deliver a
# job against a real database must not publish. The suite is therefore a step
# of this job, after `npm test` and before `npm publish`. It is
# not a `workflow_dispatch`-only file, because GitHub dispatches a workflow only
# when the file is on the default branch, and putting one on `main` early would
# publish a 2.2.x. No trigger is added for it.
on:
  push:
    branches: [main]
  # A dispatch runs only from `main` (ref guard on the job); from anywhere else
  # it does not run, because the publish step goes to `latest`.
  workflow_dispatch:

# `packages: write` is what authorises the publish. GITHUB_TOKEN is enough for
# GitHub Packages — no long-lived npm token to store or rotate, which is why
# the `npm-publish` environment and the OIDC `id-token: write` the npmjs
# workflow needed are both gone.
permissions:
  contents: read
  packages: write

# Two runs publishing overlapping versions would race on the registry.
concurrency:
  group: publish-nest-pg-boss
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    # `main` publishes `latest`, which consumers resolve through `^3.0.x`. Every
    # other ref does not run, dispatch included: before ENG-7256 a dispatch from
    # a feature branch would have published that branch to `latest`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The version + dist-tag pair, computed once: `3.0.<run>` on `latest`.
      - name: Resolve version and dist-tag
        id: meta
        run: |
          echo "version=3.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=latest" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@rockhopper-co"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # `files` is ["./dist/"], so an unbuilt tree publishes an empty package.
      - run: npm run build

      - run: npm run lint

      # The unit specs, BEFORE anything is published.
      - run: npm test

      # The e2e suite, against a real pg-boss 12 database (a postgres:14-alpine
      # testcontainer; Docker is on the hosted runner), after the unit specs and
      # BEFORE `npm publish`. Why here is in the header above the
      # trigger (plan 117 DESIGN D11). A red stops the run, so nothing publishes.
      - name: e2e on a real database (npm run test:e2e)
        run: npm run test:e2e

      # Version is derived, never committed. github.run_number is monotonic per
      # workflow file, so every merge to main produces a strictly higher
      # version without a bot pushing a version bump back to the branch —
      # nothing in git has to be edited for a release to happen, which is
      # exactly what stops a human being the thing that forgets. The patch
      # slot moves and the 3.0 minor is held, so consumers on ^3.0.0 pick it up.
      # The 2.2.x line (last 2.2.10) stays published for consumers still on
      # pg-boss 10; nothing here publishes to it any more.
      #
      # RE-PUBLISH: skip, do not fail. Because the version is derived from
      # run_number a push can never collide; the only way to reach an existing
      # version is re-running an already-successful run, where the version
      # being on the registry is the correct state and a red X would be a lie.
      # A genuine publish failure (auth, network, a rejected tarball) still
      # fails the step loudly — only "it is already there" is tolerated.
      - name: Publish @rockhopper-co/nest-pg-boss
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm version --no-git-tag-version "$VERSION"
          if npm view "@rockhopper-co/nest-pg-boss@$VERSION" version; then
            echo "@rockhopper-co/nest-pg-boss@$VERSION is already on the registry — nothing to publish."
            exit 0
          fi
          npm publish --tag "$DIST_TAG"
